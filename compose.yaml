name: unitati

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: unitati
      POSTGRES_PASSWORD: unitati
      POSTGRES_DB: unitati
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unitati -d unitati']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
